syntax = "proto3";

package tag;

option go_package = "./tag";

message TagObject {
  int64  id         = 1;
  string object_type = 2;  //user/member/goods
  string name       = 3;
  int64  ds_id      = 4;
  string db_name    = 5;
  string table_name = 6;
  string pk_column  = 7;
  int64  beid       = 8;
}
message ObjectReply { TagObject object = 1; }
message ObjectListReply {
  repeated TagObject list = 1;
  int64 total = 2;
}

message CreateObjectReq {
  string object_type = 1;
  string name        = 2;
  int64  ds_id       = 3;
  string db_name     = 4;
  string table_name  = 5;
  string pk_column   = 6;
  int64  beid        = 7;
}
message ObjectListReq { int64 beid = 1; string object_type = 2; int64 page = 3; int64 size = 4; }
message IdReq { int64 id = 1; int64 beid = 2; }

message TagDef {
  int64  id           = 1;
  int64  object_id    = 2;
  string tag_key      = 3;
  string tag_name     = 4;
  string tag_type     = 5;  //rule/fact/model
  string rule_sql     = 6;  //select <pk> as object_id, <expr> as tag_value from ...
  string refresh_cron = 7;
  int32  status       = 8;
  int64  beid         = 9;
  string object_name  = 10; //所属对象名（列表回显，冗余非落库字段）
}
message TagDefReply { TagDef def = 1; }
message TagDefListReply {
  repeated TagDef list = 1;
  int64 total = 2;
}

message CreateTagReq {
  int64  object_id    = 1;
  string tag_key      = 2;
  string tag_name     = 3;
  string tag_type     = 4;
  string rule_sql     = 5;
  string refresh_cron = 6;
  int64  beid         = 7;
}
message UpdateTagReq {
  int64  id           = 1;
  int64  object_id    = 2;
  string tag_key      = 3;
  string tag_name     = 4;
  string tag_type     = 5;
  string rule_sql     = 6;
  string refresh_cron = 7;
  int32  status       = 8; //1.启用 0.停用（全量更新契约，调用方必传）
  int64  beid         = 9;
}
message TagDefListReq {
  int64  beid      = 1;
  int64  object_id = 2;
  int64  page      = 3;
  int64  size      = 4;
}

message TaggingReq {
  int64  tag_id = 1;  //为空则对 object 全部 rule 标签打标
  int64  object_id = 2;
  int64  beid   = 3;
}
message TaggingReply {
  int64  tagged_rows = 1;  //本次写入标签值行数
  int64  tag_id      = 2;
}

message ObjectTagsReq {
  string object_pk = 1;  //对象主键值
  int64  object_id = 2;
  int64  beid      = 3;
}
message TagValueItem {
  string tag_key   = 1;
  string tag_name  = 2;
  string tag_value = 3;
  int64  tagged_at = 4;
}
message ObjectTagsReply { repeated TagValueItem tags = 1; }


// ============ 标签圈群（Phase 6 补齐）============
message TagGroup {
  int64  id                  = 1;
  string name                = 2;
  int64  object_id           = 3;
  string circle_rule_sql     = 4;  //圈选 SQL: select <pk> as object_id from <tag/join> where <标签条件>
  int64  est_count           = 5;
  string materialized_table  = 6;  //人群物化表
  int64  last_run_at         = 7;
  int64  beid                = 8;
}
message GroupReply { TagGroup group = 1; }
message GroupListReply { repeated TagGroup list = 1; int64 total = 2; }

message CreateGroupReq {
  string name              = 1;
  int64  object_id         = 2;
  string circle_rule_sql   = 3;
  int64  beid              = 4;
}
message GroupListReq { int64 beid = 1; int64 page = 2; int64 size = 3; }

message RunCircleReq {
  int64 group_id = 1;
  int64 beid     = 2;
}
message RunCircleReply {
  int64  member_count = 1;
  string msg          = 2;
}
message GroupMembersReq {
  int64  group_id = 1;
  int64  beid     = 2;
  int64  page     = 3;
  int64  size     = 4;
}
message GroupMember {
  string object_pk = 1;
  string tag_value = 2;
}
message GroupMembersReply {
  repeated GroupMember members = 1;
  int64 total = 2;
}

service Tag {
  //创建标签对象
  rpc CreateObject(CreateObjectReq) returns (ObjectReply);
  //对象列表
  rpc ListObjects(ObjectListReq) returns (ObjectListReply);
  //删除标签对象（对象下仍有标签定义或人群时拒绝）
  rpc DeleteObject(IdReq) returns (IdReq);
  //创建标签定义
  rpc CreateTag(CreateTagReq) returns (TagDefReply);
  //标签定义列表
  rpc ListTags(TagDefListReq) returns (TagDefListReply);
  //删除标签定义
  rpc DeleteTag(IdReq) returns (IdReq);
  //更新标签定义（全量更新）
  rpc UpdateTag(UpdateTagReq) returns (TagDefReply);
  //执行打标（规则 SQL 跑目标库，结果写 dc_tag_value）
  rpc Tagging(TaggingReq) returns (TaggingReply);
  //查对象标签画像
  rpc GetObjectTags(ObjectTagsReq) returns (ObjectTagsReply);
  //创建人群（圈群定义）
  rpc CreateGroup(CreateGroupReq) returns (GroupReply);
  //人群列表
  rpc ListGroups(GroupListReq) returns (GroupListReply);
  //删除人群
  rpc DeleteGroup(IdReq) returns (IdReq);
  //执行圈选（跑圈选 SQL 物化人群到 dc_tag_group_member）
  rpc RunCircle(RunCircleReq) returns (RunCircleReply);
  //人群成员查询
  rpc ListGroupMembers(GroupMembersReq) returns (GroupMembersReply);
}

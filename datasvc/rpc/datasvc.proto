syntax = "proto3";

package datasvc;

option go_package = "./datasvc";

message Api {
  int64  id            = 1;
  string name          = 2;
  string path          = 3;  //执行路径 /dsvc/{path}
  string mode          = 4;  //wizard/sql/register
  int64  datasource_id = 5;
  string sql_text      = 6;  //含 :param 占位符
  string params_json   = 7;  //[{name,type,required,default}]
  int64  cache_ttl     = 8;  //秒,0 不缓存
  string status        = 9;  //draft/published/offline
  string resp_sample_json = 10;
  string owner         = 11;
  int64  beid          = 12;
}
message ApiReply { Api api = 1; }
message ApiListReply {
  repeated Api list = 1;
  int64 total = 2;
}

message CreateApiReq {
  string name          = 1;
  string path          = 2;
  string mode          = 3;
  int64  datasource_id = 4;
  string sql_text      = 5;
  string params_json   = 6;
  int64  cache_ttl     = 7;
  string resp_sample_json = 8;
  string owner         = 9;
  int64  beid          = 10;
}
message UpdateApiReq {
  int64  id            = 1;
  int64  beid          = 2;
  string name          = 3;
  string sql_text      = 4;
  string params_json   = 5;
  int64  cache_ttl     = 6;
  string resp_sample_json = 7;
}
message ApiListReq {
  int64  beid   = 1;
  string status = 2;
  int64  page   = 3;
  int64  size   = 4;
}
message PathReq { string path = 1; int64 beid = 2; }

message ApiApp {
  int64  id             = 1;
  string app_key        = 2;
  string name           = 3;
  int64  rate_limit_qps = 4;
  string ip_whitelist   = 5; //逗号分隔,空为不限
  int64  beid           = 6;
}
message RegisterAppReq {
  string name           = 1;
  int64  rate_limit_qps = 2;
  string ip_whitelist   = 3;
  int64  beid           = 4;
}
message AppReply { ApiApp app = 1; string app_secret = 5; } //secret 仅注册时返回一次

message GrantApiReq {
  int64  api_id     = 1;
  int64  app_id     = 2;
  int64  expire_at  = 3; //0 永久
  string field_mask = 4; //脱敏字段逗号分隔
  int64  beid       = 5;
}

message ExecuteReq {
  string app_key    = 1;
  string sign       = 2;  //hmac-sha256(app_key+ts, app_secret)
  string ts         = 3;
  string path       = 4;
  string params_json = 5; //业务参数
  string ip         = 6;
  int64  beid       = 7;
}
message ExecuteReply {
  string rows_json  = 1; //查询结果(json数组)
  int64  cost_ms    = 2;
  bool   cache_hit  = 3;
  int64  affected   = 4; //写语句受影响行数
}


// ============ API 可观测（Phase 7） ============
message ApiCallLog {
  int64  id         = 1;
  int64  api_id     = 2;
  int64  app_id     = 3;
  string path       = 4;
  string status     = 5;  //ok/error/denied
  string error_code = 6;
  int64  rows_cnt   = 7;
  int32  cost_ms    = 8;
  bool   cache_hit  = 9;
  string ip         = 10;
  int64  created_at = 11;
}
message CallLogListReply { repeated ApiCallLog list = 1; int64 total = 2; }
message CallLogListReq {
  int64  beid    = 1;
  int64  api_id  = 2;
  int64  app_id  = 3;
  string status  = 4;
  int64  page    = 5;
  int64  size    = 6;
}
message ApiCallStats {
  int64  total_calls  = 1;
  int64  ok_calls     = 2;
  int64  error_calls  = 3;
  int64  denied_calls = 4;
  double success_rate = 5;
  double avg_cost_ms  = 6;
  int64  cache_hits   = 7;
}
message TopApi {
  int64  api_id = 1;
  string path   = 2;
  int64  calls  = 3;
  double avg_cost_ms = 4;
}
message StatsReq { int64 beid = 1; int32 days = 2; }
message StatsReply {
  ApiCallStats overall = 1;
  repeated TopApi top_apis = 2;
  repeated int64 daily_calls = 3;   //近 N 天调用量（升序）
  repeated string daily_dates = 4;  //对应日期 YYYY-MM-DD
}
message ApiDocReply {
  string api_name  = 1;
  string path      = 2;
  string markdown  = 3;  //Markdown 文档（含参数表/调用示例/签名说明）
  string openapi_json = 4; //OpenAPI 3.0 片段
}


service DataSvc {
  //创建API
  rpc CreateApi(CreateApiReq) returns (ApiReply);
  //更新API
  rpc UpdateApi(UpdateApiReq) returns (OkReply);
  //删除API
  rpc DeleteApi(IdReq) returns (OkReply);
  //API详情
  rpc GetApi(PathReq) returns (ApiReply);
  //API列表
  rpc ListApis(ApiListReq) returns (ApiListReply);
  //发布/下线
  rpc PublishApi(IdReq) returns (OkReply);
  rpc OfflineApi(IdReq) returns (OkReply);
  //注册应用（返回 app_key/app_secret）
  rpc RegisterApp(RegisterAppReq) returns (AppReply);
  //授权 API 给应用
  rpc GrantApi(GrantApiReq) returns (OkReply);
  //执行 API（核心：鉴权→限流→缓存→执行→脱敏）
  rpc ExecuteApi(ExecuteReq) returns (ExecuteReply);
  //调用日志
  rpc ListCallLogs(CallLogListReq) returns (CallLogListReply);
  //调用统计（成功率/耗时/TopN/日趋势）
  rpc GetCallStats(StatsReq) returns (StatsReply);
  //API 文档导出（Markdown + OpenAPI 片段）
  rpc GetApiDoc(PathReq) returns (ApiDocReply);
}

message IdReq { int64 id = 1; int64 beid = 2; }
message OkReply { bool ok = 1; }

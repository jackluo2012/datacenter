# ============================================================
# 数据中台 CI（Go 1.26 + go-zero）
# 触发：push 到 main / phase1/**，以及全部 Pull Request
# 步骤：checkout -> setup-go -> go mod verify -> build -> vet -> test -race
# 说明：pb 值传递技术债已清零（issue #18），go vet 全量严格拦截，不再做任何过滤。
# ============================================================
name: ci

on:
  push:
    branches: [main, 'phase1/**']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 安装 Go 1.26 并开启模块缓存
      - name: 安装 Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # go.sum 完整性校验
      - name: go mod verify（go.sum 完整性）
        run: go mod verify

      # 全量编译
      - name: go build
        run: go build ./...

      # 静态检查：pb 值传递技术债已清零（issue #18），vet 严格拦截，
      # 任何告警（含 copylocks）都直接导致 CI 失败
      - name: go vet（严格模式，零告警）
        run: go vet ./...

      # 单元测试：开竞态检测、禁用缓存
      - name: go test（-race -count=1）
        run: go test ./... -race -count=1

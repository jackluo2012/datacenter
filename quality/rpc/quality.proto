syntax = "proto3";

package quality;

option go_package = "./quality";

message QualityRule {
  int64  id           = 1;
  string name         = 2;
  string rule_type    = 3;  //row_count/not_null/unique/value_range/consistency/fluctuation
  string target_table = 4;
  string target_column = 5;
  string params_json  = 6;
  string threshold_json = 7;
  int32  status       = 8;
  string owner        = 9;
  int64  beid         = 10;
}
message RuleReply { QualityRule rule = 1; }
message RuleListReply {
  repeated QualityRule list = 1;
  int64 total = 2;
}

message CreateRuleReq {
  string name           = 1;
  string rule_type      = 2;
  string target_table   = 3;
  string target_column  = 4;
  string params_json    = 5;
  string threshold_json = 6;
  string owner          = 7;
  int64  beid           = 8;
}
message UpdateRuleReq {
  int64  id             = 1;
  string name           = 2;
  string rule_type      = 3;
  string target_table   = 4;
  string target_column  = 5;
  string params_json    = 6;
  string threshold_json = 7;
  int32  status         = 8; //1.启用 0.停用（全量更新契约，调用方必传）
  string owner          = 9; //空则保留原负责人
  int64  beid           = 10;
}
message IdReq    { int64 id = 1; int64 beid = 2; }
message RuleListReq {
  int64  beid   = 1;
  string rule_type = 2;
  int64  page   = 3;
  int64  size   = 4;
}

message CreateJobReq {
  string name         = 1;
  int64  datasource_id = 2;
  string db_name      = 3;
  string rule_ids     = 4;  //逗号分隔
  string cron         = 5;
  int64  beid         = 6;
}
message QualityJob {
  int64  id             = 1;
  string name           = 2;
  int64  datasource_id  = 3;
  string db_name        = 4;
  string rule_ids       = 5;
  string cron           = 6;
  string last_status    = 7;
  int64  last_run_at    = 8;
  int64  beid           = 9;
}
message JobReply { QualityJob job = 1; }
message JobListReply {
  repeated QualityJob list = 1;
  int64 total = 2;
}
message JobListReq { int64 beid = 1; int64 page = 2; int64 size = 3; }

message QualityResult {
  int64  id          = 1;
  int64  job_id      = 2;
  int64  rule_id     = 3;
  string rule_type   = 4;
  string check_value = 5;
  bool   pass_flag   = 6;
  string detail_json = 7;
  int64  run_at      = 8;
}
message RunJobReply {
  int64  job_id      = 1;
  int64  total_rules = 2;
  int64  passed      = 3;
  string last_status = 4;  //success/failed/partial
}
message ResultListReply {
  repeated QualityResult list = 1;
  int64 total = 2;
}
message ResultListReq { int64 job_id = 1; int64 pass_filter = 2; int64 page = 3; int64 size = 4; }


// ============ 落地深化（Phase 7）：告警/错误数据/健康分 ============
message AlertChannel {
  int64  id          = 1;
  string name        = 2;
  string type        = 3;   //dingtalk/feishu
  string webhook_url = 4;
  string secret      = 5;
  string min_level   = 6;   //failed/partial
  int32  status      = 7;
  int64  beid        = 8;
}
message SaveAlertChannelReq {
  int64  id          = 1;
  string name        = 2;
  string type        = 3;
  string webhook_url = 4;
  string secret      = 5;
  string min_level   = 6;
  int64  beid        = 7;
}
message AlertChannelListReply { repeated AlertChannel list = 1; int64 total = 2; }
message AlertChannelListReq { int64 beid = 1; int64 page = 2; int64 size = 3; }
message TestAlertReply { bool ok = 1; string msg = 2; }

message ErrorData {
  int64  rule_id      = 1;
  int64  job_id       = 2;
  string rows_json    = 3;
  int32  sample_count = 4;
  int64  run_at       = 5;
}
message ErrorDataListReply { repeated ErrorData list = 1; int64 total = 2; }
message ErrorDataListReq { int64 job_id = 1; int64 rule_id = 2; int64 page = 3; int64 size = 4; }

message TableProfile {
  int64  id            = 1;
  int64  datasource_id = 2;
  string table_name    = 3;
  int64  rows_cnt      = 4;
  int32  cols_cnt      = 5;
  double null_rate     = 6;
  int64  dup_pk_cnt    = 7;
  int32  health_score  = 8;
  string profile_json  = 9;
  int64  ran_at        = 10;
}
message ProfileTableReq {
  int64  datasource_id = 1;
  int64  beid          = 2;
  string db_name       = 3;
  string table_name    = 4;
  string pk_column     = 5;
}
message ProfileReply { TableProfile profile = 1; }
message ProfileListReply { repeated TableProfile list = 1; int64 total = 2; }
message ProfileListReq { int64 beid = 1; int64 datasource_id = 2; string table_name = 3; int64 page = 4; int64 size = 5; }


// ============ 统计分析（质量大盘）：通过率趋势/失败 TopN/健康分趋势 ============
message StatsReq {
  int64 beid = 1;  //多租户 id（必带）
  int32 days = 2;  //统计窗口天数：默认 7、上限 30
}
// DailyQualityStat 逐日统计点（近 N 天逐日，缺数日期补零与骨架对齐）
message DailyQualityStat {
  string date   = 1;  //YYYY-MM-DD
  int64  runs   = 2;  //当日 RunJob 次数（job+日去重）
  int64  passed = 3;  //当日通过的检查结果数
  int64  failed = 4;  //当日不通过的检查结果数
}
// FailTopRule 失败次数 TopN 规则（join dc_quality_rule 出名字，规则已删除时 name 为空串）
message FailTopRule {
  int64  rule_id   = 1;
  string rule_name = 2;
  int64  fail_cnt  = 3;
}
// HealthTrendPoint 逐日平均健康分（dc_quality_profile 按日聚合，缺剖析日期补 0）
message HealthTrendPoint {
  string date              = 1;  //YYYY-MM-DD
  double avg_health_score  = 2;  //当日平均健康分 0-100（保留 2 位小数）
}
message StatsReply {
  int64  total_runs = 1;  //近 N 天 RunJob 次数（结果表按 job+日去重计数）
  double pass_rate  = 2;  //通过率：窗口内 pass_flag=1 占比，百分数 0-100（保留 2 位小数）
  repeated DailyQualityStat daily = 3;             //近 N 天逐日（升序、补零）
  repeated FailTopRule fail_top_rules = 4;         //失败次数 Top 5
  repeated HealthTrendPoint health_trend = 5;      //近 N 天逐日平均健康分（升序、补零）
}


service Quality {
  //创建规则
  rpc CreateRule(CreateRuleReq) returns (RuleReply);
  //更新规则（全量更新）
  rpc UpdateRule(UpdateRuleReq) returns (RuleReply);
  //删除规则
  rpc DeleteRule(IdReq) returns (IdReq);
  //规则列表
  rpc ListRules(RuleListReq) returns (RuleListReply);
  //创建任务
  rpc CreateJob(CreateJobReq) returns (JobReply);
  //删除任务（结果历史不级联清理，供问题追溯）
  rpc DeleteJob(IdReq) returns (IdReq);
  //任务列表
  rpc ListJobs(JobListReq) returns (JobListReply);
  //执行任务（同步跑完规则并落结果）
  rpc RunJob(IdReq) returns (RunJobReply);
  //结果列表
  rpc ListResults(ResultListReq) returns (ResultListReply);
  //告警通道
  rpc SaveAlertChannel(SaveAlertChannelReq) returns (AlertChannel);
  rpc DeleteAlertChannel(IdReq) returns (IdReq);
  rpc ListAlertChannels(AlertChannelListReq) returns (AlertChannelListReply);
  rpc TestAlertChannel(IdReq) returns (TestAlertReply);
  //错误数据下钻
  rpc ListErrorData(ErrorDataListReq) returns (ErrorDataListReply);
  //表剖析与健康分
  rpc ProfileTable(ProfileTableReq) returns (ProfileReply);
  rpc ListProfiles(ProfileListReq) returns (ProfileListReply);
  //质量统计大盘（通过率/失败 TopN/健康分趋势）
  rpc QualityStats(StatsReq) returns (StatsReply);
}

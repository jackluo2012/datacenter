# ============================================================
# 数据标签服务容器化配置（docker compose 专用，镜像内由网关同镜发起）
# 与 tag/rpc/etc/tag.example.yaml 对齐，主机名改为 compose 服务名：
#   127.0.0.1 -> mysql / etcd（容器网络内服务名互访）
# ============================================================
Name: tag.rpc
Log:
  Mode: console
ListenOn: 0.0.0.0:8091
Etcd:
  Hosts:
    - etcd:2379
  Key: tag.rpc
Mysql:
  DataSource: root:admin@tcp(mysql:3306)/datacenter?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

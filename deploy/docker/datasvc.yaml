# ============================================================
# 数据服务（API 网关出 API）容器化配置（docker compose 专用）
# 与 datasvc/rpc/etc/datasvc.example.yaml 对齐，主机名改为 compose 服务名：
#   127.0.0.1 -> mysql / redis / etcd（容器网络内服务名互访）
# ============================================================
Name: datasvc.rpc
Log:
  Mode: console
ListenOn: 0.0.0.0:8087
Etcd:
  Hosts:
    - etcd:2379
  Key: datasvc.rpc
Mysql:
  DataSource: root:admin@tcp(mysql:3306)/datacenter?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
# API 结果缓存（ExecuteApi 使用）
CacheRedis:
  - Host: redis:6379
    Pass: admin
    Type: node
# AES-GCM 密钥（32 字节），app_secret 加密存储
EncryptKey: 0123456789abcdef0123456789abcdef
